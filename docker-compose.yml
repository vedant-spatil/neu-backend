  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aml:${POSTGRES_PASSWORD:-aml}@postgres:5432/aml
      NEO4J_URI: bolt://neo4j:7687
      YENTE_URL: http://yente:8000
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      yente:
        condition: service_started

