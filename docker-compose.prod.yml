# Production stack for one EC2 instance (plan.md section 23).
#
# First time:   scripts/ec2_bootstrap.sh, then copy .env.example to .env and fill it in,
#               then scripts/issue_cert.sh
# Start:        docker compose -f docker-compose.prod.yml up -d
# Logs:         docker compose -f docker-compose.prod.yml logs -f api
#               or CloudWatch Logs group /aml/prod (streams: api, nginx, yente, elasticsearch)
#
# Only nginx publishes ports (80, 443). Elasticsearch, yente and the API stay on the internal Docker network.
# The databases are external: Supabase Postgres (APP_DATABASE_URL) and Neo4j Aura (APP_NEO4J_URI).
# mem_limit and cpus are caps, not expected usage. The box is a t3a.medium (4 GiB RAM, 2 vCPU) with swap.
#
# Container logs go to CloudWatch through the awslogs driver. The instance role (scripts/aws/01-ec2-role.sh) gives
# the permission. mode=non-blocking: if CloudWatch is unreachable, the app keeps running and logs are dropped.
name: aml-prod

x-awslogs-region: &awslogs-region ${AWS_REGION:-ap-south-1}
x-awslogs-group: &awslogs-group ${AWS_LOG_GROUP:-/aml/prod}

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # internal network only; never published
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    cpus: "0.5"
    logging:
      driver: awslogs
      options:
        awslogs-region: *awslogs-region
        awslogs-group: *awslogs-group
        awslogs-stream: elasticsearch
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 16m

  yente:
    image: ghcr.io/opensanctions/yente:latest
    restart: unless-stopped
    environment:
      YENTE_INDEX_TYPE: elasticsearch
      YENTE_INDEX_URL: http://elasticsearch:9200
      YENTE_MANIFEST: /manifest.yml
    volumes:
      - ./docker/yente/manifest.yml:/manifest.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 768m
    cpus: "0.3"   # only answers sanctions lookups; idle most of the time
    logging:
      driver: awslogs
      options:
        awslogs-region: *awslogs-region
        awslogs-group: *awslogs-group
        awslogs-stream: yente
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 16m

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: aml-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod   # refuses the dev JWT secret and Neo4j password (app/config.py)
      # The API reads its databases from APP_DATABASE_URL and APP_NEO4J_URI in .env (Supabase and Aura). They are
      # required: compose stops with an error if either is missing, rather than falling back to local containers.
      # DATABASE_URL in .env is for running the API on the host and is not used here.
      DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in .env (Supabase session pooler URL)}
      NEO4J_URI: ${APP_NEO4J_URI:?set APP_NEO4J_URI in .env (Aura connection URI)}
      YENTE_URL: http://yente:8000
    expose:
      - "8000"   # reached only by nginx
    volumes:
      - uploads:/app/data/uploads   # CSV uploads survive container recreation; a sync can be re-run from the file
    depends_on:
      yente:
        condition: service_started
    # Freed by moving Postgres and Neo4j out of this box. A case build and a CSV sync peak near 1 GB, so the cap is
    # 1.5 GB. Measure with `docker stats` after a sync and tighten if it stays low.
    mem_limit: 1536m
    cpus: "1.5"
    logging:
      driver: awslogs
      options:
        awslogs-region: *awslogs-region
        awslogs-group: *awslogs-group
        awslogs-stream: api
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 16m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      NGINX_ENVSUBST_FILTER: API_DOMAIN   # only substitute our variable, not nginx's own $host etc.
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.2"
    logging:
      driver: awslogs
      options:
        awslogs-region: *awslogs-region
        awslogs-group: *awslogs-group
        awslogs-stream: nginx
        awslogs-create-group: "true"
        mode: non-blocking
        max-buffer-size: 16m

  # Only used by scripts/issue_cert.sh and scripts/aws/11-yente-route.sh (profile "cert"), never started by "up -d".
  certbot:
    image: certbot/certbot:latest
    profiles: ["cert"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  esdata:
  uploads:
  letsencrypt:
  certbot_www:
