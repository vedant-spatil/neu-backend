[project]
name = "aml-copilot-backend"
version = "0.1.0"
description = "AML investigation copilot API (POC)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "neo4j>=5.20",
    "httpx>=0.27",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "pandas>=2.2",
    "faker>=26.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    # "celery[redis]>=5.4",  # disabled: Celery and Redis are commented out
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
# Model scoring (app/ml). CPU torch from the PyTorch index; keep out of the API image.
ml = [
    "torch==2.3.0",
    "torch-geometric==2.8.1",
    "pyg-lib",  # neighbour sampler backend; wheel comes from the PyG index below
    "scikit-learn>=1.3",
    "wandb>=0.17",
    "tqdm>=4.66",
    "munch>=4.0",
    # Triage model (app/ml/triage_*): tree model, SHAP reason codes, Parquet feature files.
    "xgboost>=2.0",
    "shap>=0.45",
    "pyarrow>=16.0",
]

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.3.0+cpu.html"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
